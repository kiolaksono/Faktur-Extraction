name: Build Windows Executable

# Workflow ini akan berjalan otomatis saat ada perubahan di branch 'main'
# atau bisa dijalankan secara manual dari tab 'Actions'
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Menggunakan sistem operasi Windows untuk hasil kompilasi .exe yang native
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Anda bisa menyesuaikan versinya

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdfplumber pandas openpyxl pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        python -m pyinstaller --onefile --hidden-import pandas --hidden-import openpyxl faktur_extraction.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExtractFaktur-Windows-EXE
        path: dist/extract_faktur.exe
